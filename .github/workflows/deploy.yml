name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # En PRs sólo se corre el build (sin deploy) para ver que compila y que
  # la caché de imágenes funciona antes de mergear.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci (y no npm install): instala exactamente lo del lockfile y es
      # más rápido/reproducible en CI.
      - run: npm ci

      # Caché de las imágenes ya optimizadas por astro:assets (sharp). Astro
      # guarda cada variante generada (AVIF/WebP/JPG por ancho) en
      # `cacheDir`, que en astro.config.mjs movimos a ./.astro-cache (el
      # default es node_modules/.astro, que npm ci borra). Con esto, en el
      # siguiente build sólo se vuelven a procesar las fotos nuevas o que
      # cambiaron; el resto se copia de la caché.
      # La key depende de las fotos fuente y del lockfile (versión de
      # sharp/astro); restore-keys permite reusar la caché más reciente
      # aunque la key exacta cambie (p. ej. se agregó una foto).
      - name: Caché de imágenes optimizadas (astro:assets)
        uses: actions/cache@v4
        with:
          path: .astro-cache/assets
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-assets-${{ runner.os }}-

      # Impreso (issue #9): Typst fijado (print/TYPST_VERSION, sha256) y
      # poppler para los chequeos; `npm run print` exporta, compila y
      # verifica los PDF de todos los volúmenes y escribe
      # print/build/manifest.json, que `npm run build` lee para el bloque de
      # descarga y copia los PDF a dist/fanzine/<slug>/. Los PDF no se
      # commitean: en PRs quedan en el artifact `fanzine-pdfs`.
      - name: poppler-utils (pdfinfo, pdffonts, pdftoppm, pdftotext)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: Caché del binario de Typst
        uses: actions/cache@v4
        with:
          path: print/build/typst-dl
          key: typst-${{ runner.os }}-${{ hashFiles('print/TYPST_VERSION', 'print/typst.sha256') }}

      - name: Instalar Typst (versión fijada, sha256 verificado)
        run: npm run print:install

      - run: print/build/bin/typst --version

      - name: Caché de variantes de fotos del impreso
        uses: actions/cache@v4
        with:
          path: |
            print/build/vol-*/img
          key: impreso-img-${{ runner.os }}-${{ hashFiles('src/assets/**', 'print/componentes.json', 'print/reglas.json', 'package-lock.json') }}
          restore-keys: |
            impreso-img-${{ runner.os }}-

      - name: Generar y verificar los PDF del fanzine (Typst)
        run: npm run print -- --dos-veces

      - name: Resumen del impreso
        run: cat print/build/resumen.md >> "$GITHUB_STEP_SUMMARY"

      - name: Tests del motor de impresión (fixtures)
        run: npm run print:test

      - run: npm run build

      - name: PDF en dist
        run: ls -la dist/fanzine/*/ && test -z "$(git ls-files '*.pdf')"

      - uses: actions/upload-artifact@v4
        with:
          name: fanzine-pdfs
          path: |
            print/build/vol-*/jirafa-*.pdf
            print/build/vol-*/caras-*.png
            print/build/manifest.json
            print/build/resumen.md
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  # Hoja de prueba del impreso (issue #16): Typst fijado en print/TYPST_VERSION
  # con sha256 verificado, fuentes del repo, PDF verificados con poppler y
  # subidos como artifact `impreso-prueba`. Los PDF no se commitean.
  impreso:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: poppler-utils (pdfinfo, pdffonts, pdftoppm, pdftotext)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      # El .tar.xz de Typst se cachea por versión + sha256 esperado; aunque
      # venga de la caché, install-typst.sh vuelve a verificar el sha256.
      - name: Caché del binario de Typst
        uses: actions/cache@v4
        with:
          path: print/build/typst-dl
          key: typst-${{ runner.os }}-${{ hashFiles('print/TYPST_VERSION', 'print/typst.sha256') }}

      - name: Instalar Typst (versión fijada, sha256 verificado)
        run: npm run print:install

      - run: print/build/bin/typst --version

      - name: reglas.json coherente y docs/IMPRESO.md al día
        run: npm run print:check

      - name: Generar la hoja de prueba
        run: npm run print:prueba

      - name: Verificar los PDF (pdfinfo, pdffonts, pdftoppm, pdftotext, determinismo)
        run: npm run print:verify

      - name: Ningún PDF commiteado
        run: |
          if [ -n "$(git ls-files '*.pdf')" ]; then echo "Hay PDF en git:"; git ls-files '*.pdf'; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: impreso-prueba
          path: |
            print/build/jirafa-prueba-impresion.pdf
            print/build/jirafa-prueba-impresion-imprenta.pdf
            print/build/jirafa-prueba-impresion-bn.pdf
            print/build/jirafa-prueba-doble-cara.pdf
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
