name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # En PRs se corre el build completo (sin deploy) para ver que compila y
  # pasa los chequeos antes de mergear. El artifact de Pages del PR se sube
  # con el nombre github-pages-<árbol git>: al mergear, si main tiene el
  # MISMO árbol (lo normal: el PR ya estaba al día con main), el job
  # `reusar` lo encuentra y `deploy` publica ese artifact sin repetir los
  # ~5 min de build + impreso. Sólo se vuelve a compilar si el árbol cambió
  # (main avanzó entre el PR y el merge) o si el run del PR no terminó bien.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Para buscar y bajar el artifact del run del PR (job reusar / deploy).
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ¿El árbol de este commit ya se construyó y verificó en un PR? Busca un
  # artifact github-pages-<árbol> no vencido de un run que terminó en
  # success. Si lo hay, build e impreso se saltan y deploy lo reusa.
  reusar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.buscar.outputs.tree }}
      run_id: ${{ steps.buscar.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Buscar un build ya verificado del mismo árbol
        id: buscar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          # Si la API falla, run_id queda vacío y se compila (nunca se bloquea el deploy).
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages-$tree&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty' || true)
          if [ -n "$run_id" ]; then
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.conclusion // empty' || true)
            if [ "$conclusion" != "success" ]; then
              echo "::notice::Hay un artifact del árbol $tree en el run $run_id pero terminó en '$conclusion'; se compila de nuevo."
              run_id=""
            fi
          fi
          if [ -n "$run_id" ]; then
            echo "::notice::Árbol $tree ya construido y verificado en el run $run_id: build e impreso se saltan y se publica ese artifact."
          else
            echo "::notice::No hay un build verificado del árbol $tree: se compila."
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    needs: reusar
    # En PRs siempre; en main / manual sólo si no hay un build reusable.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.reusar.outputs.run_id == '') }}
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci (y no npm install): instala exactamente lo del lockfile y es
      # más rápido/reproducible en CI.
      - run: npm ci

      # Caché de las imágenes ya optimizadas por astro:assets (sharp). Astro
      # guarda cada variante generada (AVIF/WebP/JPG por ancho) en
      # `cacheDir`, que en astro.config.mjs movimos a ./.astro-cache (el
      # default es node_modules/.astro, que npm ci borra). Con esto, en el
      # siguiente build sólo se vuelven a procesar las fotos nuevas o que
      # cambiaron; el resto se copia de la caché.
      # La key depende de las fotos fuente y del lockfile (versión de
      # sharp/astro); restore-keys permite reusar la caché más reciente
      # aunque la key exacta cambie (p. ej. se agregó una foto).
      - name: Caché de imágenes optimizadas (astro:assets)
        uses: actions/cache@v4
        with:
          path: .astro-cache/assets
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-assets-${{ runner.os }}-

      # Impreso (issue #9): Typst fijado (print/TYPST_VERSION, sha256) y
      # poppler para los chequeos; `npm run print` exporta, compila y
      # verifica los PDF de todos los volúmenes y escribe
      # print/build/manifest.json, que `npm run build` lee para el bloque de
      # descarga y copia los PDF a dist/fanzine/<slug>/. Los PDF no se
      # commitean: en PRs quedan en el artifact `fanzine-pdfs`.
      - name: poppler-utils (pdfinfo, pdffonts, pdftoppm, pdftotext)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: Caché del binario de Typst
        uses: actions/cache@v4
        with:
          path: print/build/typst-dl
          key: typst-${{ runner.os }}-${{ hashFiles('print/TYPST_VERSION', 'print/typst.sha256') }}

      - name: Instalar Typst (versión fijada, sha256 verificado)
        run: npm run print:install

      - run: print/build/bin/typst --version

      - name: Caché de variantes de fotos del impreso
        uses: actions/cache@v4
        with:
          path: |
            print/build/vol-*/img
          key: impreso-img-${{ runner.os }}-${{ hashFiles('src/assets/**', 'print/componentes.json', 'print/reglas.json', 'package-lock.json') }}
          restore-keys: |
            impreso-img-${{ runner.os }}-

      - name: Generar y verificar los PDF del fanzine (Typst)
        run: npm run print -- --dos-veces

      - name: Resumen del impreso
        run: cat print/build/resumen.md >> "$GITHUB_STEP_SUMMARY"

      # Catálogo de componentes (issue #17): jirafa-kit.pdf y jirafa-kit-bn.pdf
      # desde src/components/fanzine/registro.json, con miniaturas PNG por
      # componente para /fanzine/kit. copy-dist.mjs los lleva a dist/fanzine/kit/.
      # El presupuesto por componente (CSS/SVG gzip, sin raster) se revisa con
      # check:componentes.
      - name: Catálogo de componentes (npm run print:kit)
        run: npm run print:kit

      - name: Presupuesto por componente (npm run check:componentes)
        run: npm run check:componentes

      - name: Tests del motor de impresión (fixtures)
        run: npm run print:test

      - name: Tests de esquemas y composición de volúmenes (#13)
        run: npm run test:content

      - run: npm run build

      - name: PDF en dist
        run: ls -la dist/fanzine/*/ dist/fanzine/kit/typst/ && test -f dist/fanzine/kit/jirafa-kit.pdf && test -f dist/fanzine/kit/jirafa-kit-bn.pdf && test -z "$(git ls-files '*.pdf')"

      # Presupuesto de datos (issue #8): límites y páginas en budget.json;
      # scripts/check-budget.mjs sirve dist/ con gzip y mide con Chromium
      # (Playwright) en 390×844 y caché vacía. Falla el job si /fanzine o un
      # volumen rebasa; las páginas informativas sólo avisan. Corre en PRs y
      # en main. Chromium se cachea por versión de Playwright (lockfile);
      # con cache hit sólo se instalan las librerías del sistema (~20 s).
      # Costo en el job build: ~1 min con caché (instalación + ~40 s de
      # medición); el deploy sigue dependiendo sólo de este job.
      - name: Caché de Chromium (Playwright)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalar Chromium de Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Chromium desde la caché (cache hit)"; npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Presupuesto de datos (budget.json)
        run: npm run check:budget -- --json budget-reporte.json

      # Fachadas de video y playlist (issue #17): 0 peticiones a YouTube /
      # Spotify / Bandcamp antes del clic, iframe después, enlace sin JS,
      # script ≤ 1 KB gzip y ausente en páginas sin video.
      - name: Tests de las fachadas (npm run test:web)
        run: npm run test:web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presupuesto
          path: budget-reporte.json
          if-no-files-found: ignore

      # QA del fanzine (issue #14): enlaces y anclas, índice ↔ pliegos,
      # créditos y alt, privacidad (fuentes, dist, JSON y PDF del impreso),
      # accesibilidad con axe y las filas del impreso (manifest de npm run
      # print + print:check). Resumen en el Job summary; informe completo en
      # el artifact qa-fanzine-report. Los enlaces externos sólo avisan.
      - name: QA del fanzine (npm run qa:fanzine)
        run: npm run qa:fanzine

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-fanzine-report
          path: qa-fanzine-report/
          if-no-files-found: ignore

      # Pruebas negativas del QA: cada chequeo falla cuando debe (fixtures en
      # tests/qa/fixtures/, fuera de src/).
      - name: Tests del QA (fixtures negativos)
        run: npm run qa:test

      - uses: actions/upload-artifact@v4
        with:
          name: fanzine-kit
          path: |
            print/build/kit/jirafa-kit.pdf
            print/build/kit/jirafa-kit-bn.pdf
            print/build/kit/manifest-kit.json
            print/build/kit/typst/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fanzine-pdfs
          path: |
            print/build/vol-*/jirafa-*.pdf
            print/build/vol-*/caras-*.png
            print/build/manifest.json
            print/build/resumen.md
          if-no-files-found: error

      # El artifact de Pages va al final, después de todos los chequeos: si
      # existe es porque el build entero pasó. Nombre = github-pages-<árbol>,
      # en PRs y en main, para que `reusar` lo encuentre al mergear.
      - name: Árbol git de este build
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ steps.tree.outputs.tree }}
          retention-days: 7

  # Hoja de prueba del impreso (issue #16): Typst fijado en print/TYPST_VERSION
  # con sha256 verificado, fuentes del repo, PDF verificados con poppler y
  # subidos como artifact `impreso-prueba`. Los PDF no se commitean.
  impreso:
    needs: reusar
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.reusar.outputs.run_id == '') }}
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: poppler-utils (pdfinfo, pdffonts, pdftoppm, pdftotext)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      # El .tar.xz de Typst se cachea por versión + sha256 esperado; aunque
      # venga de la caché, install-typst.sh vuelve a verificar el sha256.
      - name: Caché del binario de Typst
        uses: actions/cache@v4
        with:
          path: print/build/typst-dl
          key: typst-${{ runner.os }}-${{ hashFiles('print/TYPST_VERSION', 'print/typst.sha256') }}

      - name: Instalar Typst (versión fijada, sha256 verificado)
        run: npm run print:install

      - run: print/build/bin/typst --version

      - name: reglas.json coherente y docs/IMPRESO.md al día
        run: npm run print:check

      - name: Generar la hoja de prueba
        run: npm run print:prueba

      - name: Verificar los PDF (pdfinfo, pdffonts, pdftoppm, pdftotext, determinismo)
        run: npm run print:verify

      - name: Ningún PDF commiteado
        run: |
          if [ -n "$(git ls-files '*.pdf')" ]; then echo "Hay PDF en git:"; git ls-files '*.pdf'; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: impreso-prueba
          path: |
            print/build/jirafa-prueba-impresion.pdf
            print/build/jirafa-prueba-impresion-imprenta.pdf
            print/build/jirafa-prueba-impresion-bn.pdf
            print/build/jirafa-prueba-doble-cara.pdf
          if-no-files-found: error

  deploy:
    needs: [reusar, build]
    # Publica el build de este run, o el del PR ya verificado (mismo árbol).
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.reusar.outputs.run_id != '')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reuso: el artifact de Pages vive en el run del PR; deploy-pages sólo
      # ve los de este run, así que se baja (artifact.tar) y se vuelve a
      # subir con el mismo nombre. Son segundos, contra ~5 min de build.
      - name: Bajar el artifact de Pages del run del PR
        if: needs.build.result == 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: github-pages-${{ needs.reusar.outputs.tree }}
          run-id: ${{ needs.reusar.outputs.run_id }}
          github-token: ${{ github.token }}
          path: pages

      - name: Subirlo a este run
        if: needs.build.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-${{ needs.reusar.outputs.tree }}
          path: pages/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # El de este run (build) o el reusado (reusar); es el mismo árbol.
          artifact_name: github-pages-${{ needs.build.outputs.tree || needs.reusar.outputs.tree }}
