# Volumen 01 "La Jirafa Elektrika" (octubre 2026), publicado desde el PR #10
# de fanzine-redaccion: reseña de "Foreign Tongues" (Edy Yáñez) y "En vivo en
# la Escandón" (Mrk Inthehat + fotorreportaje de @sailor.mauveilleux_).
# El MDX viejo (src/content/posts/volumen-01.mdx) queda como legado y las
# piezas 2026-08-* de la maqueta anterior quedan en el repo sin usarse.
numero: 1
# Masthead de la portada aprobada (el arte dice "Jirafa Elektrika").
titulo: "La Jirafa Elektrika"
fecha: 2026-10-01
publishDate: 2026-10-01
# La portada aprobada es rosa.
colorScheme: rosa
descripcion: "Reseña de “Foreign Tongues”, en vivo en la Escandón y el poema “Tranquilo, no es contra ti.”"
portada:
  # Portada aprobada en la Puerta 2 (1162 × 1600, copia byte a byte de
  # volumenes/vol-01/portada_vol1_final.jpg del repo de redacción).
  imagen: "/piezas/vol-01/portada.jpg"
  alt: "Portada del volumen 1 de La Jirafa Eléctrica: jirafa mecánica con cresta, parche de Bujía, cinta y sticker sobre fondo rosa."
  # El arte ya es la portada entera: sin velo, título ni mascota encima; sólo la etiqueta Vol. 01.
  completa: true
  # Sin crédito de portada aparte: el arte es de la casa y su crédito es el de
  # la mascota (@olafh_ace), apagado con mostrar_credito_mascota.
# Reseña págs. 3–4 (2), en vivo págs. 5–10 (6), poema págs. 11–16 (6).
# N crece a 20: huecos 17–18 con relleno, Fin 19, contraportada 20.
piezas:
  - { pieza: 2026-10-resena-foreign-tongues, desde: 3 }
  - { pieza: 2026-10-en-vivo-en-la-escandon, desde: 5 }
  - { pieza: 2026-10-tranquilo-no-es-contra-ti, desde: 11 }
  - { relleno: colabora, desde: 17 }
  - { relleno: notas, desde: 18 }
contraportada:
  texto: "Bujía Project Music — Texcoco, MX"
  creditos:
    - "Edy Yáñez"
    - "Texto: Mrk Inthehat · Fotos y pies de foto: @sailor.mauveilleux_"
    - "Poema: Hun Cib (@la.huncib)"
    - "Video: @clh_capturandolahistoria"
impreso:
  multimedia: qr
# Publicado sin listar: noindex, fuera de /fanzine, /volumenes y el sitemap,
# sin tarjeta de descarga (se comparte por enlace).
sin_listar: true
# Oculta sólo el crédito de la mascota / arte de la casa (issue #37). Los
# créditos de las colaboraciones siempre se ven. En true vuelve a aparecer.
mostrar_credito_mascota: false
draft: false
